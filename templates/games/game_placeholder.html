{% extends 'base.html' %}
{% block title %}{{ game.title }} | İklimKiti{% endblock %}
{% block content %}
<section class="section">
    <div class="container">
        <div class="form-card">
            <h1>{{ game.title }}</h1>
            <p>{{ game.description }}</p>
            <p>{{ game.instructions }}</p>
            <p>Bu oyun yakında aktif olacak.</p>
            <a class="primary-btn" href="{% url 'topic_detail' game.topic.slug %}">Konuya dön</a>
        </div>
    </div>
</section>
{% endblock %}
