{% extends 'base.html' %}
{% block title %}{{ video.title }} | İklimKiti{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>{{ video.title }}</h1>
    </div>
</section>
<section class="section">
    <div class="container">
        <div class="card">
            {% if embed_url %}
            <iframe width="100%" height="420" src="{{ embed_url }}" title="{{ video.title }}" frameborder="0" allowfullscreen></iframe>
            {% else %}
            <p>Bu video için paylaşım linki henüz eklenmemiş.</p>
            {% endif %}
            <p>{{ video.description }}</p>
            <a href="{% url 'video_list' %}">Videolara dön</a>
        </div>
    </div>
</section>
{% endblock %}
