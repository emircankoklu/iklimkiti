{% extends 'base.html' %}
{% block title %}Sözlük | İklim Tabağım{% endblock %}
{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Sözlük</h1>
    </div>
</section>
<section class="section">
    <div class="container">
        <div class="filter-bar">
            <input type="search" placeholder="Terim ara..." value="{{ query }}">
        </div>
        <div class="grid grid-3">
            {% for term in terms %}
            <div class="card">
                <h3>{{ term.title }}</h3>
                <p>{{ term.definition|truncatechars:120 }}</p>
                <a href="{% url 'glossary_detail' term.slug %}">Detay</a>
            </div>
            {% empty %}
            <div class="empty-state">Sözlük terimi bulunamadı.</div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
